
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: typosquatshield-postgres-test
    environment:
      POSTGRES_DB: typosquatshield_test
      POSTGRES_USER: tps_test
      POSTGRES_PASSWORD: local_test_password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tps_test -d typosquatshield_test
      interval: 5s
      timeout: 5s
      retries: 10
