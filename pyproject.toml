
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typosquatshield"
version = "0.1.0"
description = "Pre-installation PyPI package risk advisory CLI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.7,<15.0"
]

[project.scripts]
tps = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]
