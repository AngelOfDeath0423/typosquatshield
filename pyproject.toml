[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typosquatshield"
version = "0.1.0"
description = "Pre-installation PyPI package risk advisory CLI"
readme = "PYPI_README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.7,<15.0",
    "packaging>=24,<27"
]

[project.scripts]
tps = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]

[project.urls]
Homepage = "https://github.com/AngelOfDeath0423/typosquatshield"
Repository = "https://github.com/AngelOfDeath0423/typosquatshield"
"Web Dashboard" = "https://typosquatshield.streamlit.app"